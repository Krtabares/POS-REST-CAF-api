<section class="p-4">
    <h2 class="text-xl font-semibold mb-4">Payments</h2>

    <p-toolbar class="mb-3">
        <div class="p-toolbar-group-left">
            <p-button label="New" icon="pi pi-plus" (onClick)="openNew()"></p-button>
            <p-button label="Delete" icon="pi pi-trash" severity="danger" class="ml-2" (onClick)="deleteSelected()" [disabled]="!selected || !selected.length"></p-button>
        </div>
    </p-toolbar>

    <p-table [value]="payments()" [(selection)]="selected" dataKey="_id" [tableStyle]="{ 'min-width': '50rem' }" [rows]="10" [paginator]="true">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 3rem"></th>
                <th>Order</th>
                <th>Method</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Paid At</th>
                <th>Branch</th>
                <th style="width: 8rem">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>
                    <p-checkbox [(ngModel)]="item.selected" [binary]="true" [ngModelOptions]="{ standalone: true }"></p-checkbox>
                </td>
                <td>
                    <span>{{ formatRef(item.orderId) }}</span>
                </td>
                <td>{{ item.method }}</td>
                <td>S/ {{ item.amount | number: '1.2-2' }}</td>
                <td>{{ item.status }}</td>
                <td>{{ item.paidAt || '-' }}</td>
                <td>{{ formatBranch(item.branchId) }}</td>
                <td>
                    <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (onClick)="edit(item)"></p-button>
                    <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteOne(item)"></p-button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="dialog" [style]="{ width: '30rem' }" header="Payment" [modal]="true" (onHide)="hideDialog()">
        <app-payment-form [form]="form" [orders]="orders" [branches]="branches" [methods]="methods"></app-payment-form>
        <ng-template pTemplate="footer">
            <p-button label="Save" icon="pi pi-check" (onClick)="save()"></p-button>
            <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="hideDialog()"></p-button>
        </ng-template>
    </p-dialog>
</section>
