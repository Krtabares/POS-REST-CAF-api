<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <span class="text-sm text-muted"
            >Sucursal:
            <span class="font-medium">{{ currentBranchId ? currentBranchId : 'Todas' }}</span>
        </span>
    </ng-template>
    <ng-template #end>
        <p-button label="Reload" icon="pi pi-refresh" severity="secondary" (onClick)="refresh()" />
    </ng-template>
</p-toolbar>

<div class="card overflow-auto">
    <p-table
        #dt
        [value]="filtered()"
        [rows]="10"
        [paginator]="true"
        dataKey="_id"
        [rowHover]="true"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} orders"
        [rowsPerPageOptions]="[10, 20, 30]"
        [globalFilterFields]="[
            'orderNumber',
            'type',
            'status',
            'paymentStatus',
            'subtotal',
            'tax',
            'total',
            'tableId',
            'createdBy',
            'branchId',
            'branchId.name',
            'createdAt'
        ]"
        [tableStyle]="{ 'min-width': '75rem' }"
    >
        <ng-template pTemplate="caption">
            <div class="flex items-center justify-between">
                <h5 class="m-0">Orders</h5>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter($event)" placeholder="Search..." />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th># Orden</th>
                <th>Estado</th>
                <th>Pago</th>
                <th>Total</th>
                <th>Sucursal</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-o>
            <tr>
                <td>{{ o.orderNumber }}</td>
                <td>{{ o.status }}</td>
                <td>{{ o.paymentStatus }}</td>
                <td>S/ {{ o.total | number: '1.2-2' }}</td>
                <td>{{ branchLabel(o) }}</td>
                <td>{{ formatDate(o.createdAt) }}</td>
                <td>
                    <p-button label="Editar" icon="pi pi-pencil" severity="info" size="small" (onClick)="edit(o)" />
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="p-4 text-center text-muted">No hay órdenes para mostrar.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
